[composition]
id = "cockpit_session"

[compositions.settings]
use = "skaldos/cockpit/config"

[compositions.runtime]
use = "skaldos/cockpit/roba_runtime"

[compositions.tmux]
use = "skaldos/cockpit/tmux_workspace"

[functions.start]
description = "Start or reuse one complete Cockpit-owned ROBA and tmux runtime."

[functions.start_master]
description = "Start or reuse the runtime, open its master workbench and optionally attach."

[functions.attach]
description = "Attach only to one healthy existing Cockpit runtime."

[functions.status]
description = "Inspect one Cockpit runtime without creating or repairing anything."

[functions.stop]
description = "Stop one provably owned Cockpit runtime in daemon-first order."

[functions.reset]
description = "Replace one provably owned Cockpit runtime and attach with a fresh capability."

[functions.open_connection]
description = "Create or focus one legacy non-secret connection window."

[functions.open_master_workbench]
description = "Create, focus or respawn the master workbench in one healthy Cockpit runtime."

[functions.update_status]
description = "Refresh legacy non-secret catalog status."

[functions.paths]
description = "Return all non-secret paths for one named Cockpit runtime."
