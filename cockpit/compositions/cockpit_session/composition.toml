[composition]
id = "cockpit_session"

[compositions.settings]
use = "skaldos/cockpit/config"

[compositions.tmux]
use = "skaldos/cockpit/tmux_workspace"

[functions.start]
description = "Start or focus one named isolated Cockpit session."

[functions.attach]
description = "Attach only to an existing named Cockpit session."

[functions.status]
description = "Inspect one named Cockpit session without creating anything."

[functions.stop]
description = "Stop only one named Cockpit session."

[functions.open_connection]
description = "Create or focus the stable window for one non-secret catalog identity."

[functions.update_status]
description = "Refresh non-secret session status after a catalog reload."

[functions.paths]
description = "Return the non-secret catalog, runtime, socket and config paths."
