[composition]
id = "store_browser"
[compositions.catalog]
use = "skaldos/cockpit/store_catalog"
[compositions.provider]
use = "skaldos/cockpit/roba_store"
[compositions.values]
use = "skaldos/visidata/value_workbench"
[functions.create_session]
description = "Create a pane-local browser over the shared volatile catalog."
[functions.new_store]
description = "Choose a provider and open a local Store definition draft."
[functions.edit_store]
description = "Edit one detached Store definition with an explicit catalog commit."
[functions.start]
description = "Run one independent read-only VisiData Store browser."

[functions.create_selected_session]
description = "Create a revision-pinned Nolspace browser rooted at exactly one saved Store."
[functions.start_selected]
description = "Run the selected Nolspace browser with lazy lookup and atomic content mutation."

[compositions.nolspace]
use = "skaldos/stores/nolspace/core/api"
[compositions.nolspace_provider]
use = "skaldos/stores/nolspace/roba/provider"
[compositions.nolspace_connection]
use = "skaldos/stores/nolspace/roba/connection"
