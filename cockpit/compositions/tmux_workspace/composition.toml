[composition]
id = "tmux_workspace"

[functions.socket_path]
description = "Build and validate the dedicated short Cockpit tmux socket path."

[functions.config_path]
description = "Return the Cockpit-owned tmux configuration path."

[functions.status]
description = "Inspect one Cockpit session without creating a tmux server or session."

[functions.start]
description = "Create or focus one session on the isolated Cockpit tmux server."

[functions.attach]
description = "Attach to one existing Cockpit session without creating it."

[functions.stop]
description = "Stop only one named Cockpit session and clean an empty owned server."

[functions.open_window]
description = "Create or focus one stable non-secret Cockpit window."

[functions.layout_control]
description = "Add the small Cockpit-owned header pane to a new Control window."

[functions.layout_runtime]
description = "Add one separate non-secret logo/status pane to a new owner-shell window."

[functions.update_status]
description = "Update only non-secret Cockpit session status options."

[functions.update_runtime_status]
description = "Update only the non-secret status options of one privileged Cockpit runtime."

[functions.window_name]
description = "Derive one stable non-secret connection window name from a catalog ID."
