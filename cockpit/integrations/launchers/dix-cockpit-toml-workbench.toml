# Optional installer template. Quoted @...@ values are materialized from the central DIX env.
[launcher]
name = "dix-cockpit-toml-workbench"
adapter = "python_cli"
application = "skaldos/cockpit/toml_workbench"
function = "main"

[[modules]]
id = "skaldos/visidata"
source = "@SKALDOS_VISIDATA_WORKBENCH_MODULE@"

[[modules]]
id = "skaldos/cockpit"
source = "@SKALDOS_COCKPIT_WORKBENCH_MODULE@"
