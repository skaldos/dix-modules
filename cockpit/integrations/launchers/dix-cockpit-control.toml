# Internal window launcher; arguments contain catalog identity, never capabilities.
[launcher]
name = "dix-cockpit-control"
adapter = "python_cli"
application = "skaldos/cockpit/control_window"
function = "main"

[[modules]]
id = "dix/state"
source = "@DIX_STATE_MODULE@"

[[modules]]
id = "dix/cli"
source = "@DIX_CLI_MODULE@"

[[modules]]
id = "dix/norn"
source = "@DIX_NORN_MODULE@"

[[modules]]
id = "dix/roba"
source = "@DIX_ROBA_MODULE@"

[[modules]]
id = "skaldos/visidata"
source = "@SKALDOS_VISIDATA_MODULE@"

[[modules]]
id = "skaldos/cockpit"
source = "@SKALDOS_COCKPIT_MODULE@"
