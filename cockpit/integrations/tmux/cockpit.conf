# DIX Cockpit owns this isolated tmux server. Never source a host configuration here.
set -g mouse off
setw -g mode-keys vi
set -g prefix C-a
set -g prefix2 C-b
unbind C-b
bind C-a send-prefix
bind C-b send-prefix -2
set -sg escape-time 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -g default-terminal "screen-256color"
set -as terminal-features ",alacritty:RGB"
set -g history-limit 50000
set -g exit-empty off

bind r source-file "$DIX_COCKPIT_TMUX_CONFIG" \; display-message "Cockpit config reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind C-h previous-window
bind C-l next-window
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

bind Escape copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "$DIX_COCKPIT_CLIPBOARD_COPY"
bind p run-shell '"$DIX_COCKPIT_CLIPBOARD_PASTE" | tmux -S "$DIX_COCKPIT_TMUX_SOCKET" load-buffer - && tmux -S "$DIX_COCKPIT_TMUX_SOCKET" paste-buffer'
bind C-p paste-buffer

set -g @cockpit-temp-window-up ""
set -g @cockpit-temp-window-down ""
bind Up if-shell -F '#{!=:#{@cockpit-temp-window-up},}' 'select-window -t "=#{@cockpit-temp-window-up}"' 'display-message "No Cockpit Up target"'
bind Down if-shell -F '#{!=:#{@cockpit-temp-window-down},}' 'select-window -t "=#{@cockpit-temp-window-down}"' 'display-message "No Cockpit Down target"'

set -g status on
set -g status-style "bg=#1d2021,fg=#ebdbb2"
set -g status-left " #[bold]DIX Cockpit #[default]#S "
set -g status-right " #{socket_path} | %Y-%m-%d %H:%M "
setw -g window-status-current-style "bg=#458588,fg=#fbf1c7,bold"
setw -g window-status-style "fg=#a89984"
set -g pane-border-status top
set -g pane-border-format " #{pane_title} "
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#83a598"
